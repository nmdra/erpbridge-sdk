name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lts/-2 (Node 20) is EOL (April 2026) and cannot build tsdown's
        # runner ("Failed to import module unrun") — keep the two active LTS.
        node: ['lts/-1', 'lts/*']
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  publish-gate:
    name: publish gate
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Publish gate (publint + attw + tarball assertions)
        run: npm run lint:publish
      - name: Pack dry-run
        run: npm pack --dry-run --json

  osv-scan-pr:
    name: vulnerability scan (OSV, PR)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    # google/osv-scanner-action v2.5.1 — reusable PR workflow that scans the
    # merge ref, compares against the base, and uploads SARIF to code scanning.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    with:
      fail-on-vuln: true

  osv-scan-scheduled:
    name: vulnerability scan (OSV, scheduled)
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      security-events: write
      contents: read
    # google/osv-scanner-action v2.5.1 — reusable workflow that scans the tree
    # (-r ./) and uploads SARIF; runs on the nightly schedule so the union feed
    # (audit + osv) is checked daily, not just on PRs (D15).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true