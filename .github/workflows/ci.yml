name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['lts/-2', 'lts/-1', 'lts/*']
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  publish-gate:
    name: publish gate
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Publish gate (publint + attw + tarball assertions)
        run: npm run lint:publish
      - name: Pack dry-run
        run: npm pack --dry-run --json

  osv-scan:
    name: vulnerability scan (OSV)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan dependencies
        # google/osv-scanner-action v2.5.1
        uses: google/osv-scanner-action/scanner@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        id: osv-scanner
        with:
          args: '-r .'
      - name: Fail on findings (no PR comment)
        # google/osv-scanner-action v2.5.1
        uses: google/osv-scanner-action/scan-pr@6e4298ebc4db23e847df9b2e2de2939d6f066c67
        with:
          dry-run: 'true'